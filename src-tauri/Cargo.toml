[package]
name = "airplay-mirror"
version = "1.2.1"
description = "Mirrwin — Windows screen mirroring receiver (Tauri 2)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "airplay_mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# FFI bridge to the native AirPlay protocol DLL (xenos1337/AirPlayServer plus
# the overlay in tools/airplay-dll). We load the C library at runtime and start
# the receiver via its C ABI; it hands back H.264 and connect/disconnect events
# through callbacks. See docs/ffi-contract.md.
libloading = "0.8"

[dev-dependencies]
# tests/dll_load.rs exercises the real DLL through the same loader production
# uses, so it must be available to the integration test as well.
libloading = "0.8"

[features]
default = []
