name: build

# Build the Windows app on GitHub's servers.
# - Every push to main (or manual run) → builds and uploads the installer as a
#   downloadable artifact on the workflow run page.
# - Pushing a version tag like v0.1.0 → additionally publishes a GitHub Release
#   with the installer attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create Releases on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (NSIS installer)
        run: npm run tauri build

      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mirrwin-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
